name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-gate:
    name: Full gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the clean snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # Required by the history assertions below. At the default depth of 1,
          # `git rev-list --count HEAD` returns 1 for ANY history and `git log` sees only the tip,
          # so those assertions silently verify nothing. The gate now refuses a shallow clone
          # outright, which turns that mistake into a loud failure instead of a false pass.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 8.15.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.11.0
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # The content scan is the privacy net: it runs in every repository holding this tree
      # (private source, public snapshot) and on every event. Never make it conditional.
      - name: Sensitive-content scan (tracked tree)
        run: pnpm check:public-snapshot

      # The history assertions describe the PUBLIC snapshot's shape — one squashed release commit
      # per release, noreply identity, linear, single root. The private source repository's history
      # is real development work by a real author and would rightly fail them, so they are scoped
      # to the public repository rather than skipped by weakening the rules.
      - name: Public snapshot history assertions
        if: github.event_name == 'push' && github.repository == 'Brushcodex/standard'
        run: pnpm check:public-snapshot -- --history

      - name: Local link validation
        run: pnpm check:links

      - name: Consistency (prose and schema)
        run: pnpm check:consistency

      - name: Build packages
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit and integration tests
        run: pnpm -r test

      - name: Conformance
        run: pnpm conformance

      - name: Gate helper regression tests
        run: pnpm test:gate

      - name: Packed release and licensing gate
        run: pnpm verify:packed

      - name: Production dependency audit
        run: pnpm audit --prod
