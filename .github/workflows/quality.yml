name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-gate:
    name: Full gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # Required by the commit-identity assertion below. At the default depth of 1, `git log`
          # sees only the tip commit, so the assertion silently verifies almost nothing. The gate
          # refuses a shallow clone outright, which turns that mistake into a loud failure instead
          # of a false pass — it was a false pass here for the whole of this gate's first life.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 8.15.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.11.0
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # The content scan is the privacy net. This repository is public and `main` forbids
      # force-pushes, so anything that lands is permanent. Runs on every event, unconditionally.
      - name: Sensitive-content scan (tracked tree)
        run: pnpm check:publication-safety

      # Commit identity, checked on the commits a pull request PROPOSES — before they are
      # permanent. `main` requires a pull request and forbids force-pushes, so catching a personal
      # address after the merge would be too late to do anything about.
      - name: Commit identity (proposed commits)
        if: github.event_name == 'pull_request'
        run: pnpm check:publication-safety -- --identity --range=${{ github.event.pull_request.base.sha }}..HEAD

      # And again over the whole history on push, so the property holds for the repository as a
      # whole rather than only for whatever most recently passed review.
      - name: Commit identity (full history)
        if: github.event_name == 'push'
        run: pnpm check:publication-safety -- --identity

      - name: Local link validation
        run: pnpm check:links

      - name: Consistency (prose and schema)
        run: pnpm check:consistency

      - name: Build packages
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit and integration tests
        run: pnpm -r test

      - name: Conformance
        run: pnpm conformance

      - name: Gate helper regression tests
        run: pnpm test:gate

      - name: Packed release and licensing gate
        run: pnpm verify:packed

      - name: Production dependency audit
        run: pnpm audit --prod
